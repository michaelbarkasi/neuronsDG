url: https://michaelbarkasi.github.io/neuronsDG/
template:
  bootstrap: 5
  light-switch: true
  math-rendering: katex

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Introduction
      href: index.html
    reference:
      text: Package Functions
      href: reference/index.html
    github:
      icon: fab fa-github
      href: https://github.com/michaelbarkasi/neuronsDG

articles:
- title: Installation
  navbar: Installation
  contents:
  - articles/install

- title: Tutorials
  navbar: Tutorials
  contents:
  - starts_with("articles/tutorial_")

- title: Legal
  navbar: Legal
  contents:
  - articles/license

reference:
- title: Initialization functions
  navbar: Initialization functions
  contents:
  - starts_with("new.")
  - load.rasters.as.neurons

- title: The neuron class
  navbar: The neuron class
  contents:
  - Rcpp_neuron-class
  - neuron-methods

- title: Neuron accessor functions
  navbar: Neuron accessor functions
  contents:
  - starts_with("fetch.")
  - load.trial.data
  - compute.crosscorr

- title: Neuron method wrappers
  navbar: Neuron method wrappers
  contents:
  - fit.edf.autocorr
  - compute.autocorr
  - estimate.autocorr.params
  - process.autocorr
  - plot_raster
  - plot_autocorrelation
  
- title: Analysis functions
  navbar: Analysis functions
  contents:
  - starts_with("analyze.")
  - test.sigma.assumption

- title: Methods for analysis results
  navbar: Methods for analysis results
  contents:
  - neuronsDG_analysis-methods
  - plot.neuronsDG_autocorr_table
  - print.neuronsDG_estimates

- title: Preprocessing functions
  navbar: Preprocessing functions
  contents:
  - import.kilo4
  - preprocess.kilo4
  - summarize.cluster.key

- title: Demo data
  navbar: Demo data
  contents:
  - starts_with("get_")
